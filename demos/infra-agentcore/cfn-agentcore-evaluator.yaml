AWSTemplateFormatVersion: '2010-09-09'
Description: 'AgentCore Evaluators for agent quality assessment (Module 4 Part 3)'

Resources:
  ToolSelectionEvaluator:
    Type: AWS::BedrockAgentCore::Evaluator
    Properties:
      EvaluatorName: mladas_tool_selection
      Description: 'Evaluates whether the agent chose the right tools for the task.'
      EvaluatorConfig:
        LlmAsAJudge:
          ModelConfig:
            BedrockEvaluatorModelConfig:
              ModelId: apac.anthropic.claude-sonnet-4-20250514-v1:0
          Instructions: |
            Assess whether the agent chose the right tools for the task.

            Here is the context of the agent's execution:
            {context}

            Here is the assistant's response:
            {assistant_turn}

            Consider if the agent used unnecessary tools or missed tools it should have used.
            A perfect score means the agent used exactly the right tools with no extras or omissions.
          RatingScale:
            Numerical:
              - Label: Perfect
                Definition: Used exactly the right tools with correct parameters
                Value: 1.0
              - Label: Good
                Definition: Mostly correct tool selection with minor extras
                Value: 0.75
              - Label: Acceptable
                Definition: Acceptable but could have been more efficient
                Value: 0.5
              - Label: Poor
                Definition: Wrong tools or too many unnecessary calls
                Value: 0.25
              - Label: Failed
                Definition: Completely wrong tools or no tools when needed
                Value: 0.0
      Level: TRACE

  ComplianceEvaluator:
    Type: AWS::BedrockAgentCore::Evaluator
    Properties:
      EvaluatorName: mladas_compliance_check
      Description: 'Evaluates whether agent responses include required disclaimers and follow compliance rules.'
      EvaluatorConfig:
        LlmAsAJudge:
          ModelConfig:
            BedrockEvaluatorModelConfig:
              ModelId: apac.anthropic.claude-sonnet-4-20250514-v1:0
          Instructions: |
            Assess whether the agent response follows compliance requirements:
            1. Does not make unauthorized financial promises
            2. Includes appropriate caveats for technical advice
            3. Does not expose sensitive customer data unnecessarily
            4. Follows the refund policy (30-day window) correctly

            Here is the full session context:
            {context}

            Here is the tool trajectory:
            {actual_tool_trajectory}
          RatingScale:
            Categorical:
              - Label: Compliant
                Definition: Fully compliant with all requirements
              - Label: Minor issues
                Definition: Mostly compliant with minor gaps
              - Label: Non-compliant
                Definition: Significant compliance violations
      Level: SESSION

  # --- Online Evaluation Configuration (uses built-in evaluators) ---
  EvaluationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/bedrock-agentcore/strands
      RetentionInDays: 7

  EvaluationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mladas-evaluation-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvaluationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                Resource: '*'

  OnlineEvalConfig:
    Type: AWS::BedrockAgentCore::OnlineEvaluationConfig
    DependsOn:
      - EvaluationLogGroup
      - EvaluationExecutionRole
    Properties:
      OnlineEvaluationConfigName: mladas_comprehensive_eval
      Description: 'Comprehensive evaluation for TechMart demo agents using built-in evaluators'
      EvaluationExecutionRoleArn: !GetAtt EvaluationExecutionRole.Arn
      Rule:
        SamplingConfig:
          SamplingPercentage: 100
      DataSourceConfig:
        CloudWatchLogs:
          LogGroupNames:
            - /aws/bedrock-agentcore/strands
          ServiceNames:
            - mladas-demo.default
      Evaluators:
        - EvaluatorId: Builtin.Correctness
        - EvaluatorId: Builtin.Helpfulness
        - EvaluatorId: Builtin.Coherence
        - EvaluatorId: Builtin.ToolSelectionAccuracy
        - EvaluatorId: Builtin.GoalSuccessRate

Outputs:
  ToolSelectionEvaluatorId:
    Value: !Ref ToolSelectionEvaluator
    Export:
      Name: mladas-tool-selection-evaluator-id

  ToolSelectionEvaluatorArn:
    Value: !GetAtt ToolSelectionEvaluator.EvaluatorArn
    Export:
      Name: mladas-tool-selection-evaluator-arn

  ComplianceEvaluatorId:
    Value: !Ref ComplianceEvaluator
    Export:
      Name: mladas-compliance-evaluator-id

  ComplianceEvaluatorArn:
    Value: !GetAtt ComplianceEvaluator.EvaluatorArn
    Export:
      Name: mladas-compliance-evaluator-arn

  OnlineEvalConfigId:
    Value: !GetAtt OnlineEvalConfig.OnlineEvaluationConfigId
    Export:
      Name: mladas-online-eval-config-id

  OnlineEvalConfigArn:
    Value: !GetAtt OnlineEvalConfig.OnlineEvaluationConfigArn
    Export:
      Name: mladas-online-eval-config-arn
