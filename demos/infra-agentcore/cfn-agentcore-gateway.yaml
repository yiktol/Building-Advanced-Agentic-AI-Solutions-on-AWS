AWSTemplateFormatVersion: '2010-09-09'
Description: 'AgentCore Gateway with MCP tool targets (Module 1 Part 3, Module 2 Part 5)'

Resources:
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mladas-gateway-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GatewayInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'

  ToolGateway:
    Type: AWS::BedrockAgentCore::Gateway
    DependsOn: GatewayRole
    Properties:
      Name: mladas-tool-gateway
      Description: 'Centralized MCP-compatible tool gateway for TechMart demos'
      AuthorizerType: NONE
      RoleArn: !GetAtt GatewayRole.Arn
      ProtocolConfiguration:
        Mcp:
          Instructions: 'TechMart customer service tool gateway providing product lookup, compatibility checking, and order status tools.'

  ProductLookupTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref ToolGateway
      Name: product-lookup
      Description: 'Look up TechMart product details including specs, price, and availability.'
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
          CredentialProvider:
            IamCredentialProvider:
              Service: lambda
              Region: !Ref AWS::Region
      TargetConfiguration:
        Mcp:
          OpenApiSchema:
            InlinePayload: |
              openapi: "3.0.0"
              info:
                title: Product Lookup
                version: "1.0"
              servers:
                - url: https://api.techmart.example.com
              paths:
                /lookup:
                  post:
                    operationId: productLookup
                    summary: Look up product details
                    requestBody:
                      content:
                        application/json:
                          schema:
                            type: object
                            properties:
                              product_name:
                                type: string
                                description: Product name to search
                    responses:
                      "200":
                        description: Product details

  CompatibilityCheckTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref ToolGateway
      Name: compatibility-check
      Description: 'Check compatibility between two TechMart products for smart home integration.'
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
          CredentialProvider:
            IamCredentialProvider:
              Service: lambda
              Region: !Ref AWS::Region
      TargetConfiguration:
        Mcp:
          OpenApiSchema:
            InlinePayload: |
              openapi: "3.0.0"
              info:
                title: Compatibility Check
                version: "1.0"
              servers:
                - url: https://api.techmart.example.com
              paths:
                /check:
                  post:
                    operationId: compatibilityCheck
                    summary: Check product compatibility
                    requestBody:
                      content:
                        application/json:
                          schema:
                            type: object
                            properties:
                              product_a:
                                type: string
                              product_b:
                                type: string
                    responses:
                      "200":
                        description: Compatibility result

  OrderStatusTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref ToolGateway
      Name: order-status
      Description: 'Check order status, delivery tracking, and return eligibility.'
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
          CredentialProvider:
            IamCredentialProvider:
              Service: lambda
              Region: !Ref AWS::Region
      TargetConfiguration:
        Mcp:
          OpenApiSchema:
            InlinePayload: |
              openapi: "3.0.0"
              info:
                title: Order Status
                version: "1.0"
              servers:
                - url: https://api.techmart.example.com
              paths:
                /status:
                  post:
                    operationId: orderStatus
                    summary: Check order status
                    requestBody:
                      content:
                        application/json:
                          schema:
                            type: object
                            properties:
                              order_id:
                                type: string
                    responses:
                      "200":
                        description: Order details

Outputs:
  GatewayId:
    Value: !Ref ToolGateway
    Export:
      Name: mladas-gateway-id

  GatewayArn:
    Value: !GetAtt ToolGateway.GatewayArn
    Export:
      Name: mladas-gateway-arn
