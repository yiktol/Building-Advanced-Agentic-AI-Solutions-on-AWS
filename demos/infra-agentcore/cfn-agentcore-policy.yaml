AWSTemplateFormatVersion: '2010-09-09'
Description: 'AgentCore Policy Engine (Module 3)'

Resources:
  PolicyEngine:
    Type: AWS::BedrockAgentCore::PolicyEngine
    Properties:
      Name: mladas_policy_engine
      Description: 'Cedar-based policy engine for TechMart agent authorization'

Outputs:
  PolicyEngineId:
    Value: !GetAtt PolicyEngine.PolicyEngineId
    Export:
      Name: mladas-policy-engine-id

  PolicyEngineArn:
    Value: !Ref PolicyEngine
    Export:
      Name: mladas-policy-engine-arn
