AWSTemplateFormatVersion: "2010-09-09"
Description: "MLADAS Demo - CloudFront distribution with ALB origin"

Parameters:
  DomainName:
    Type: String
  WebApplicationFirewallACLArn:
    Type: String
  CertificateId:
    Type: String
  ProjectPrefix:
    Type: String
    Default: mladas-app
  AssetSourceBucketName:
    Type: String
    Default: yikyakyuk-ap-southeast-1-875692608981

Resources:
  # --- Random String for Origin Verification ---
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'

  RandomStringFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Role: !GetAtt LambdaRole.Arn
      Handler: index.handler
      Timeout: 30
      Code:
        S3Bucket: !Ref AssetSourceBucketName
        S3Key: lambda/random_generator.zip

  RandomString:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      Length: 25
      IncludePunctuation: false
      ServiceToken: !GetAtt RandomStringFunction.Arn

  # --- Secret for CloudFront-ALB Verification ---
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'cloudfront/${ProjectPrefix}'
      Description: CloudFront to ALB origin verification
      SecretString: !Sub |
        {
          "HEADER_VALUE": "${RandomString.RandomString}",
          "HEADER_NAME": "X-CloudFront-Origin-Verify"
        }
      ReplicaRegions:
        - Region: us-east-1

  # --- Logging ---
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectPrefix}-logging-${AWS::Region}-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: "s3:*"
            Resource: !Sub "arn:aws:s3:::${LogBucket}/*"
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                "aws:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # --- CloudFront ---
  Distribution:
    DependsOn: OriginSecret
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectPrefix} demo'
        Enabled: true
        HttpVersion: http2and3
        Aliases:
          - !Sub '${ProjectPrefix}.${DomainName}'
        ViewerCertificate:
          AcmCertificateArn: !Sub 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${CertificateId}'
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId: !Ref WebApplicationFirewallACLArn
        Logging:
          Bucket: !Sub '${LogBucket}.s3.amazonaws.com'
          Prefix: cloudfront-logs/
        Origins:
          - DomainName: !Sub 'lb-${ProjectPrefix}.${DomainName}'
            Id: alb-origin
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: !Join ['', ['{{resolve:secretsmanager:cloudfront/', !Ref ProjectPrefix, ':SecretString:HEADER_NAME}}']]
                HeaderValue: !Join ['', ['{{resolve:secretsmanager:cloudfront/', !Ref ProjectPrefix, ':SecretString:HEADER_VALUE}}']]
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, DELETE, POST, OPTIONS, PUT, PATCH]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Sub '${DomainName}.'
      Name: !Sub '${ProjectPrefix}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontURL:
    Value: !Sub 'https://${ProjectPrefix}.${DomainName}'
  CloudFrontALBSecretName:
    Value: !Sub 'cloudfront/${ProjectPrefix}'
  DistributionId:
    Value: !Ref Distribution
